# Production Nginx Configuration for api-dev.owlscottage.com and dev.owlscottage.com
# Place this file at /etc/nginx/sites-available/owlscottage and symlink to sites-enabled

# Upstreams
upstream api_upstream {
    server 127.0.0.1:3001;
    keepalive 64;
}

upstream web_upstream {
    server 127.0.0.1:3000;
    keepalive 64;
}

# Rate limiting for uploads (prevent abuse)
limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=10r/s;

# API Server - api-dev.owlscottage.com
server {
    listen 80;
    listen [::]:80;
    server_name api-dev.owlscottage.com;

    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api-dev.owlscottage.com;

    # SSL Configuration (use certbot --nginx for Let's Encrypt)
    # ssl_certificate /etc/letsencrypt/live/api-dev.owlscottage.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api-dev.owlscottage.com/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    # ssl_prefer_server_ciphers off;

    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";

    # Client upload settings
    client_max_body_size 100m;
    client_body_buffer_size 10m;
    client_body_timeout 1800s;
    client_header_timeout 60s;

    # Proxy timeouts (30 minutes for large uploads)
    proxy_connect_timeout 1800s;
    proxy_send_timeout 1800s;
    proxy_read_timeout 1800s;
    send_timeout 1800s;

    # Keep-alive settings
    keepalive_timeout 65;
    keepalive_requests 100;

    # Buffering settings
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;
    proxy_busy_buffers_size 8k;

    # Upload endpoint - disable buffering for streaming
    location /api/campaigns/upload {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

                # Disable buffering for streaming uploads
        proxy_request_buffering off;
        proxy_buffering off;

                # Extended timeouts for large file uploads
        proxy_connect_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;

                # Rate limiting
        limit_req zone=upload_limit burst=20 nodelay;
    }

    # All other API routes
    location /api {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;

        # Standard timeouts for API
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Socket.io
    location /socket.io {
        proxy_pass http://api_upstream/socket.io;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket timeouts
        proxy_connect_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;

        # WebSocket specific
        proxy_buffering off;
    }

    # Static files
    location /data {
        alias /path/to/your/api/data;  # Update this path
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Health check
    location /health {
        proxy_pass http://api_upstream/health;
        access_log off;
    }
}

# Frontend - dev.owlscottage.com
server {
    listen 80;
    listen [::]:80;
    server_name dev.owlscottage.com;

    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dev.owlscottage.com;

    # SSL Configuration (use certbot --nginx for Let's Encrypt)
    # ssl_certificate /etc/letsencrypt/live/dev.owlscottage.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/dev.owlscottage.com/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    # ssl_prefer_server_ciphers off;

    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-XSS-Protection "1; mode=block";

    # Client upload settings
    client_max_body_size 100m;
    client_body_buffer_size 10m;
    client_body_timeout 1800s;

    # Proxy timeouts
    proxy_connect_timeout 1800s;
    proxy_send_timeout 1800s;
    proxy_read_timeout 1800s;
    send_timeout 1800s;

    # Disable buffering for uploads
    proxy_buffering off;
    proxy_request_buffering off;

    location / {
        proxy_pass http://web_upstream;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Next.js static assets
    location /_next/static {
        proxy_pass http://web_upstream;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, immutable";
    }

    # Upload proxy endpoint
    location /api/campaigns/upload-proxy {
        proxy_pass http://web_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for streaming
        proxy_request_buffering off;
        proxy_buffering off;

        # Extended timeouts for large file uploads
        proxy_connect_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
    }
}
