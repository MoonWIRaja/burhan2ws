version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: whatsapp_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: burhan
      POSTGRES_PASSWORD: burhan2ws
      POSTGRES_DB: whatsapp_blast
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U burhan -d whatsapp_blast"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend_network

  mysql:
    image: mysql:8.4
    container_name: whatsapp_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: whatsapp_blast
      MYSQL_USER: burhan
      MYSQL_PASSWORD: burhan2ws
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -proot"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend_network

  redis:
    image: redis:7.2.4-alpine
    container_name: whatsapp_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend_network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whatsapp_api
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - DB_PROVIDER=${DB_PROVIDER:-postgresql}
      - DATABASE_URL=${DATABASE_URL:-postgresql://burhan:burhan2ws@postgres:5432/whatsapp_blast}
      - REDIS_URL=redis://redis:6379
      - PORT=3001
      - NODE_ENV=production
      - DATA_PATH=/app/data
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-your-secret-key-here}
      - BETTER_AUTH_URL=http://localhost:3001
      - FRONTEND_URL=http://localhost  # Pointing to Nginx
    volumes:
      - whatsapp_data:/app/data
    networks:
      - backend_network

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: /api
    container_name: whatsapp_web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      - NEXT_PUBLIC_API_URL=/api        # Browser sees Nginx relative path
      - INTERNAL_API_URL=http://api:3001 # SSR sees API container
    networks:
      - backend_network

  nginx:
    image: nginx:1.25.4-alpine
    container_name: whatsapp_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - api
    networks:
      - backend_network

volumes:
  postgres_data:
  mysql_data:
  redis_data:
  whatsapp_data:

networks:
  backend_network:
    driver: bridge
